# Publishes app/static/ to GitHub Pages. The app is fully static: the model is
# trained offline by `python -m src.build`, which commits the three JSON
# artifacts, and the browser does all the EV recompute. No build step needed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push queues behind a running deploy instead of
# cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/static
          # Keep .nojekyll in the artifact; v5 drops dotfiles by default.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
